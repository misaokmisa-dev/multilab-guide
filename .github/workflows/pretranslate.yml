name: Pretranslate MULTI LAB GUIDE languages
on:
  push:
    paths:
      - '.github/workflows/pretranslate.yml'
      - 'scripts/pretranslate.py'
      - 'scripts/check_i18n.py'
      - 'i18n/overrides.json'
      - '*.html'
      - 'devices/**.html'
      - 'minecraft/**.html'
      - 'minecraft/articles/**.html'
      - 'minecraft/mods/**.html'
      - 'roblox/**.html'
      - 'devices/**.js'
      - 'minecraft/**.js'
      - 'roblox/**.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pretranslate-mlg
  cancel-in-progress: true
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ARGOS_CHUNK_TYPE: SPACY
      ARGOS_DEVICE_TYPE: cpu
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation engine
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Generate, validate and publish from latest site revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Changes can occur while offline language packs are downloading.
          # Regenerate from the latest remote revision instead of rebasing
          # a very large translation JSON file and causing merge conflicts.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/pretranslate.py
            python scripts/check_i18n.py
            git add i18n/catalog.js i18n/build-report.json
            if git diff --cached --quiet; then
              echo "Translation bundles already current"
              exit 0
            fi
            git commit -m "Update pretranslated language bundles"
            if git push origin HEAD:main; then
              echo "Pretranslated languages published"
              exit 0
            fi
            echo "Concurrent edit detected; rebuilding against newest main"
          done
          echo "Failed to publish pretranslations after retries"
          exit 1
