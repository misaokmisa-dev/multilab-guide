name: Pretranslate MULTI LAB GUIDE languages
on:
  push:
    paths:
      - '.github/workflows/pretranslate.yml'
      - 'scripts/pretranslate.py'
      - '*.html'
      - 'devices/**.html'
      - 'minecraft/**.html'
      - 'minecraft/articles/**.html'
      - 'minecraft/mods/**.html'
      - 'roblox/**.html'
      - 'devices/**.js'
      - 'minecraft/**.js'
      - 'roblox/**.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pretranslate-mlg
  cancel-in-progress: true
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ARGOS_CHUNK_TYPE: SPACY
      ARGOS_DEVICE_TYPE: cpu
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation engine
        run: python -m pip install --disable-pip-version-check argostranslate==1.11.0
      - name: Generate English Korean Chinese static dictionaries
        run: python scripts/pretranslate.py
      - name: Publish only completed translation bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/catalog.js i18n/build-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update pretranslated language bundles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
