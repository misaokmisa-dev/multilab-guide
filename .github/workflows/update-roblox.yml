name: Update ROBLOX ranking observations
on:
  push:
    paths:
      - '.github/workflows/update-roblox.yml'
      - 'roblox/data/catalog.json'
      - 'scripts/update_roblox.py'
  schedule:
    - cron: '21 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roblox-observations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read public Roblox game metrics
        run: python scripts/update_roblox.py
      - name: Commit only updated observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roblox/data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ROBLOX game observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
