name: Update Minecraft Item SEO Titles and Sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-item-seo-titles.yml'
      - 'scripts/update_item_seo_titles.py'
      - 'minecraft/strategy/items/items-data.js'
      - 'minecraft/strategy/items/items-2026-data.js'
      - 'minecraft/strategy/items/recipes-data.js'
      - 'minecraft/strategy/items/recipes-2026-data.js'

permissions:
  contents: write

concurrency:
  group: minecraft-item-seo-titles
  cancel-in-progress: true

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate all pre-rendered item titles and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_item_seo_titles.py
            git add -A -- minecraft/strategy/items/detail sitemap.xml
            if git diff --cached --quiet; then
              echo "All 1,672 item pages, titles and sitemap entries match the recipes"
              exit 0
            fi
            git commit -m "Sync all 1,672 Minecraft item SEO titles and static URLs"
            if git push origin HEAD:main; then
              echo "Updated item titles published"
              exit 0
            fi
            echo "Concurrent push detected; rebuild against latest main"
          done
          echo "Failed to publish title updates after retries"
          exit 1
