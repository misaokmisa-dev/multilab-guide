<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Language smoke test</title></head><body><p id="result">Checking translation API...</p><script>(async()=>{const out=document.getElementById('result');try{const r=await fetch('/api/site-translate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lang:'en',texts:['このサイトはゲームの情報を紹介しています。']})});const b=await r.json();out.textContent='HTTP '+r.status+' '+JSON.stringify(b);}catch(e){out.textContent='ERROR '+String(e);}})();</script></body></html>
